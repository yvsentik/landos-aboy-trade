<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<!-- Своя капча «выберите похожий цвет» для новых посетителей -->
		<script type="text/javascript">
			// false – капча выключена.
			window.__captchaOn = true;
			// Капча для каждого нового посетителя (кроме поисковых роботов и лендинга /agency).
			// Прошёл – 30 дней не спрашиваем.
			window.__captchaNeeded = (function () {
				if (!window.__captchaOn || location.pathname.startsWith('/agency')) return false;
				// поисковые и служебные роботы индексируют сайт без капчи
				if (/bot|crawl|spider|slurp|yandex(?!browser)|googlebot|bingpreview|lighthouse|pagespeed/i.test(navigator.userAgent))
					return false;
				try {
					if (Number(localStorage.getItem('cpt_ok')) > Date.now()) return false;
				} catch (e) {}
				return true;
			})();
		</script>
		<!-- Yandex.Metrika counter (не грузим на отдельном лендинге /agency; до прохождения капчи – не запускаем) -->
		<script type="text/javascript">
			if (!location.pathname.startsWith('/agency')) {
				window.ym =
					window.ym ||
					function () {
						(window.ym.a = window.ym.a || []).push(arguments);
					};
				window.ym.l = 1 * new Date();
				window.__ymStart = function () {
					if (window.__ymStarted) return;
					window.__ymStarted = true;
					var r = 'https://mc.yandex.ru/metrika/tag.js?id=114270840';
					for (var j = 0; j < document.scripts.length; j++) {
						if (document.scripts[j].src === r) return;
					}
					var k = document.createElement('script'),
						a = document.getElementsByTagName('script')[0];
					k.async = 1;
					k.src = r;
					a.parentNode.insertBefore(k, a);
					ym(114270840, 'init', {
						ssr: true,
						webvisor: true,
						clickmap: true,
						ecommerce: 'dataLayer',
						referrer: document.referrer,
						url: location.href,
						accurateTrackBounce: true,
						trackLinks: true
					});
				};
				if (!window.__captchaNeeded) window.__ymStart();
			}
		</script>
		<!-- /Yandex.Metrika counter -->
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<noscript
			><div>
				<img
					src="https://mc.yandex.ru/watch/114270840"
					style="position: absolute; left: -9999px"
					alt=""
				/></div
		></noscript>
	</body>
</html>
