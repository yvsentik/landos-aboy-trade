<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon-falkov.svg" />
		%sveltekit.head%
		<!-- Капча для новых посетителей: показывать ли её, решаем до загрузки страницы -->
		<script type="text/javascript">
			// Поисковые и служебные роботы видят сайт без капчи. Прошёл – 30 дней не спрашиваем.
			window.__captchaNeeded = (function () {
				if (/bot|crawl|spider|slurp|yandex(?!browser)|googlebot|bingpreview|lighthouse|pagespeed/i.test(navigator.userAgent))
					return false;
				try {
					if (Number(localStorage.getItem('cpt_ok')) > Date.now()) return false;
				} catch (e) {}
				return true;
			})();
		</script>
		<!-- Yandex.Metrika counter: до прохождения капчи не запускаем, чтобы в статистику не попадали боты -->
		<script type="text/javascript">
			window.ym =
				window.ym ||
				function () {
					(window.ym.a = window.ym.a || []).push(arguments);
				};
			window.ym.l = 1 * new Date();
			window.__ymStart = function () {
				if (window.__ymStarted) return;
				window.__ymStarted = true;
				var r = 'https://mc.yandex.ru/metrika/tag.js?id=114413702';
				for (var j = 0; j < document.scripts.length; j++) {
					if (document.scripts[j].src === r) return;
				}
				var k = document.createElement('script'),
					a = document.getElementsByTagName('script')[0];
				k.async = 1;
				k.src = r;
				a.parentNode.insertBefore(k, a);
				ym(114413702, 'init', {
					ssr: true,
					webvisor: true,
					clickmap: true,
					ecommerce: 'dataLayer',
					referrer: document.referrer,
					url: location.href,
					accurateTrackBounce: true,
					trackLinks: true
				});
			};
			if (!window.__captchaNeeded) window.__ymStart();
		</script>
		<!-- /Yandex.Metrika counter -->
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<noscript
			><div><img src="https://mc.yandex.ru/watch/114413702" style="position: absolute; left: -9999px" alt="" /></div
		></noscript>
	</body>
</html>
