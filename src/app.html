<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
		<!-- Капча для заходов из поисковиков (Яндекс SmartCaptcha) -->
		<script type="text/javascript">
			// Клиентский ключ SmartCaptcha. Пустой – капча выключена.
			window.__captchaKey = 'ysc1_Pndp9i8f6YUSGFaXhaZnN2nfwzThljxN1WhObWQc563cab0a';
			window.__captchaNeeded = (function () {
				if (!window.__captchaKey || location.pathname.startsWith('/agency')) return false;
				// проверка вручную: ?captcha_test=1 – показать капчу всегда
				if (location.search.indexOf('captcha_test=1') !== -1) return true;
				try {
					if (Number(localStorage.getItem('cpt_ok')) > Date.now()) return false;
				} catch (e) {}
				var host = '';
				try {
					host = new URL(document.referrer).hostname;
				} catch (e) {}
				return /(^|\.)(yandex|ya|google|bing|mail|rambler|duckduckgo|yahoo)\./i.test(host);
			})();
		</script>
		<!-- Yandex.Metrika counter (не грузим на отдельном лендинге /agency; до прохождения капчи – не запускаем) -->
		<script type="text/javascript">
			if (!location.pathname.startsWith('/agency')) {
				window.ym =
					window.ym ||
					function () {
						(window.ym.a = window.ym.a || []).push(arguments);
					};
				window.ym.l = 1 * new Date();
				window.__ymStart = function () {
					if (window.__ymStarted) return;
					window.__ymStarted = true;
					var r = 'https://mc.yandex.ru/metrika/tag.js?id=114270840';
					for (var j = 0; j < document.scripts.length; j++) {
						if (document.scripts[j].src === r) return;
					}
					var k = document.createElement('script'),
						a = document.getElementsByTagName('script')[0];
					k.async = 1;
					k.src = r;
					a.parentNode.insertBefore(k, a);
					ym(114270840, 'init', {
						ssr: true,
						webvisor: true,
						clickmap: true,
						ecommerce: 'dataLayer',
						referrer: document.referrer,
						url: location.href,
						accurateTrackBounce: true,
						trackLinks: true
					});
				};
				if (!window.__captchaNeeded) window.__ymStart();
			}
		</script>
		<!-- /Yandex.Metrika counter -->
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<noscript
			><div>
				<img
					src="https://mc.yandex.ru/watch/114270840"
					style="position: absolute; left: -9999px"
					alt=""
				/></div
		></noscript>
	</body>
</html>
