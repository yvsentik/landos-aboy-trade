name: Setup server

# Запускает deploy/setup-server.sh на сервере по SSH.
# Нужен секрет репозитория SERVER_PASSWORD (пароль root).
on:
  push:
    branches: [deploy-server-setup]
    paths:
      - deploy/**
      - .github/workflows/setup-server.yml
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      HOST: 194.58.95.244
      DOMAIN: fotooboi.oboitrade.ru
      SSHPASS: ${{ secrets.SERVER_PASSWORD }}
      BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
      SMARTCAPTCHA_SERVER_KEY: ${{ secrets.SMARTCAPTCHA_SERVER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "::error::Добавьте секрет SERVER_PASSWORD в Settings → Secrets and variables → Actions"
            exit 1
          fi
      - name: Check DNS
        run: |
          IPS=$(dig +short A "$DOMAIN" @1.1.1.1)
          echo "$DOMAIN → ${IPS:-нет A-записи}"
          if ! echo "$IPS" | grep -qx "$HOST"; then
            echo "::error::A-запись $DOMAIN должна указывать на $HOST"
            exit 1
          fi
      - run: sudo apt-get install -y sshpass
      - name: Run setup-server.sh
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password,keyboard-interactive \
            root@"$HOST" "DOMAIN=$DOMAIN BITRIX_WEBHOOK='$BITRIX_WEBHOOK' SMARTCAPTCHA_SERVER_KEY='$SMARTCAPTCHA_SERVER_KEY' bash -s" < deploy/setup-server.sh
      - name: Check site
        run: |
          curl -sS -o /dev/null -w "http  → HTTP %{http_code} %{redirect_url}\n" "http://$DOMAIN/"
          curl -sS -o /dev/null -w "https → HTTP %{http_code}\n" "https://$DOMAIN/"
      - name: Check lead API
        run: |
          # Заведомо неверный телефон: сервис должен ответить 400, лид не создаётся
          curl -sS -X POST "https://$DOMAIN/api/lead" -H 'Content-Type: application/json' -d '{"phone":"1"}'
          echo
          if [ -z "$BITRIX_WEBHOOK" ]; then echo "::warning::Секрет BITRIX_WEBHOOK не задан – заявки не уйдут в Битрикс"; fi
          if [ -z "$SMARTCAPTCHA_SERVER_KEY" ]; then echo "::warning::Секрет SMARTCAPTCHA_SERVER_KEY не задан – капча проверяется только в браузере"; fi
